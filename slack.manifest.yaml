_metadata:
  major_version: 2

display_information:
  name: owl
  description: Submit confessions to me anonymously
  background_color: "#1a49d6"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: owl
    always_online: false
  slash_commands:
    - command: /owl
      url: https://prox3.3kh0.dev/slack/events
      description: Submit an anonymous confession
      usage_hint: "[message]"
      should_escape: true
    - command: /owl-self-reject
      url: https://prox3.3kh0.dev/slack/events
      description: Withdraw your own confession
      usage_hint: "<id>"
      should_escape: false
    - command: /owl-revive
      url: https://prox3.3kh0.dev/slack/events
      description: Recover pending confessions
      should_escape: false
  shortcuts:
    - name: Reply anonymously
      type: message
      callback_id: reply_anon
      description: Reply as the author of a confession
    - name: React anonymously
      type: message
      callback_id: react_anon
      description: React anonymously
    - name: Suspend anon replies
      type: message
      callback_id: suspend_replies
      description: (Reviewers only) Suspend anon replies, delete this reply and following ones

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - reactions:write
      - im:history
      - channels:read
      - groups:read
      - channels:history
      - groups:history

settings:
  event_subscriptions:
    request_url: https://prox3.3kh0.dev/slack/events
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://prox3.3kh0.dev/slack/events
    message_menu_options_url: https://prox3.3kh0.dev/slack/events
  socket_mode_enabled: false
  token_rotation_enabled: false
  org_deploy_enabled: true
