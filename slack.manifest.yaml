display_information:
  name: Owl
  description: Submit confessions to me anonymously
  long_description:
    "a simple Slack bot for anonymous confessions, replies, and reactions. built to be fast, secure, and not fancy. it should stand the test of time, and not be a burden to maintain.\r

    \r

    Open source at https://github.com/hackclub-community/owl"
  background_color: "#1a49d6"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Owl
    always_online: true
  shortcuts:
    - name: Reply anonymously
      type: message
      callback_id: reply_anon
      description: Reply as the author of a confession
    - name: React anonymously
      type: message
      callback_id: react_anon
      description: React anonymously
    - name: Suspend anon replies
      type: message
      callback_id: suspend_replies
      description: (Reviewers only) Suspend anon replies, delete this reply and following ones
  slash_commands:
    - command: /owl
      description: Submit an anonymous confession
      should_escape: true
      url: https://prox3.3kh0.dev/slack/events
      usage_hint: "[message]"
    - command: /owl-self-reject
      description: Withdraw your own confession
      should_escape: false
      url: https://prox3.3kh0.dev/slack/events
      usage_hint: <id>
    - command: /owl-revive
      description: Recover pending confessions
      should_escape: false
      url: https://prox3.3kh0.dev/slack/events

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - reactions:write
      - im:history
      - channels:read
      - groups:read
      - channels:history
      - groups:history
  pkce_enabled: false

settings:
  event_subscriptions:
    bot_events:
      - message.im
    request_url: https://prox3.3kh0.dev/slack/events
  interactivity:
    is_enabled: true
    message_menu_options_url: https://prox3.3kh0.dev/slack/events
    request_url: https://prox3.3kh0.dev/slack/events
  org_deploy_enabled: true
  socket_mode_enabled: false
  is_mcp_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
