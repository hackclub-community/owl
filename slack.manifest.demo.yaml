# demo instance for #owlery-demo
display_information:
  name: (demo) Owl
  description: Try out Owl. NOT anonymous, your name is shown on everything
  long_description:
    "a demo of Owl, the anonymous confessions bot, so you can try every feature in #owlery-demo. for real anonymous confessions use the actual Owl.\r

    \r

    Open source at https://github.com/hackclub-community/owl"
  background_color: "#6b7280"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: (demo) Owl
    always_online: true
  shortcuts:
    - name: (demo) Reply anonymously
      type: message
      callback_id: reply_anon
      description: Reply as the author of a demo post (not anonymous)
    - name: (demo) React anonymously
      type: message
      callback_id: react_anon
      description: React as the author of a demo post
    - name: (demo) Suspend replies
      type: message
      callback_id: suspend_replies
      description: (Reviewers only) Suspend anon replies, delete this reply and following ones
  slash_commands:
    - command: /demo-owl
      description: Submit a demo post (not anonymous)
      should_escape: true
      usage_hint: "[message]"
    - command: /demo-owl-self-reject
      description: Withdraw your own demo post
      should_escape: false
      usage_hint: <id>
    - command: /demo-owl-revive
      description: Recover pending demo posts
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - reactions:write
      - im:history
      - channels:read
      - groups:read
      - channels:history
      - groups:history
      - users:read
  pkce_enabled: false

settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: true
  socket_mode_enabled: true
  is_mcp_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
